name: flip-math

# Two services on the shared "web" network:
#   fm-server — Node/Socket.IO game server (internal only, port 3001)
#   fm-web    — Caddy serving the static client and proxying /socket.io/ to fm-server
# The shared proxy (../proxy) routes the public hostname to fm-web.
#
# Deploy from this folder:
#   docker compose build
#   docker compose up -d

services:
  fm-server:
    build:
      context: ..
      dockerfile: platform/deploy/Dockerfile
      target: server
      args:
        GAME_DIR: flip-math
        SCOPE: "@fm"
    image: fm-server
    restart: unless-stopped
    expose:
      - "3001" # reachable only on the docker network, not published
    networks:
      - web

  fm-web:
    build:
      context: ..
      dockerfile: platform/deploy/Dockerfile
      target: web
      args:
        GAME_DIR: flip-math
        SCOPE: "@fm"
    image: fm-web
    restart: unless-stopped
    environment:
      # platform/deploy/Caddyfile 用它当反代目标
      GAME_SERVER: fm-server:3001
    depends_on:
      - fm-server
    networks:
      - web

networks:
  web:
    external: true
