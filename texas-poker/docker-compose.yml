name: texas-poker

services:
  texas-poker-server:
    build:
      context: ..
      dockerfile: platform/deploy/Dockerfile
      target: server
      args:
        GAME_DIR: texas-poker
        SCOPE: "@texas-poker"
    image: texas-poker-server
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - web

  texas-poker-web:
    build:
      context: ..
      dockerfile: platform/deploy/Dockerfile
      target: web
      args:
        GAME_DIR: texas-poker
        SCOPE: "@texas-poker"
    image: texas-poker-web
    restart: unless-stopped
    environment:
      # platform/deploy/Caddyfile 用它当反代目标
      GAME_SERVER: texas-poker-server:3001
    depends_on:
      - texas-poker-server
    networks:
      - web

networks:
  web:
    external: true
