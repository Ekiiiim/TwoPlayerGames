name: texas-poker

services:
  texas-poker-server:
    build:
      context: ..
      dockerfile: texas-poker/Dockerfile
      target: server
    image: texas-poker-server
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - web

  texas-poker-web:
    build:
      context: ..
      dockerfile: texas-poker/Dockerfile
      target: web
    image: texas-poker-web
    restart: unless-stopped
    depends_on:
      - texas-poker-server
    networks:
      - web

networks:
  web:
    external: true
